name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p buildsrc
          unzip -o BossJobAssistant_Android_v0_1.zip -d buildsrc

      - name: Fix Java and Kotlin JVM target
        run: |
          cd buildsrc/BossJobAssistant_Android_v0_1
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              'defaultConfig {',
              '''compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlin {
                  jvmToolchain(17)
              }

              defaultConfig {'''
          )

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          gradle -p buildsrc/BossJobAssistant_Android_v0_1 :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BossJobAssistant-debug-apk
          path: buildsrc/BossJobAssistant_Android_v0_1/app/build/outputs/apk/debug/app-debug.apk
